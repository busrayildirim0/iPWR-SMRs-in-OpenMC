version: '3.8'

services:
  smr-core:
    build:
      context: .
      dockerfile: platform/backend/Dockerfile
    image: busrayildiriim/smr-core:latest
    container_name: smr-core-container
    ports:
      - "0.0.0.0:8005:8000"
    volumes:
      # Mount OpenMC cross sections from host (.env configurable)
      - ${OPENMC_CROSS_SECTIONS_DIR:-/home/byildirim/Desktop/endfb-vii.1-hdf5}:/data/endfb-vii.1-hdf5
      # Mount Geant4 data library from host (.env configurable)
      - ${GEANT4_DATA_DIR:-/home/byildirim/Desktop/geant4_data}:/data/geant4_data
      # Mount runs folder for persistent output results
      - ./platform/backend/runs:/app/platform/backend/runs
    environment:
      - OPENMC_CROSS_SECTIONS=/data/endfb-vii.1-hdf5/cross_sections.xml
      - G4NEUTRONHPDATA_ROOT=/data/geant4_data
      - DOCKER_ENV=1
      - GEANT4_EXE=/app/platform/hizli_geant4/beavrs_assembly
    restart: always

  web-dashboard:
    build:
      context: .
      dockerfile: platform/frontend/Dockerfile
    image: busrayildiriim/web-dashboard:latest
    container_name: web-dashboard-container
    ports:
      - "0.0.0.0:6010:80"
    depends_on:
      - smr-core
    restart: always
