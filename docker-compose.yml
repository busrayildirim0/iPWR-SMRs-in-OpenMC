version: '3.8'

services:
  smr-core:
    build:
      context: .
      dockerfile: platform/backend/Dockerfile
    image: busrayildiriim/smr-core:latest
    container_name: smr-core-container
    ports:
      - "8000:8000"
    volumes:
      # Mount cross sections from host (.env configurable)
      - ${OPENMC_CROSS_SECTIONS_DIR:-/home/busra/openmc_project}:/data
      # Mount runs folder for persistent output results
      - ./platform/backend/runs:/app/platform/backend/runs
    environment:
      - OPENMC_CROSS_SECTIONS=/data/endfb-vii.1-hdf5/cross_sections.xml
      - DOCKER_ENV=1
      - GEANT4_EXE=/app/platform/hizli_geant4/beavrs_assembly
    restart: always

  web-dashboard:
    build:
      context: .
      dockerfile: platform/frontend/Dockerfile
    image: busrayildiriim/web-dashboard:latest
    container_name: web-dashboard-container
    ports:
      - "80:80"
    depends_on:
      - smr-core
    restart: always
