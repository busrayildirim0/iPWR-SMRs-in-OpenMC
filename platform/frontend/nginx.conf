server {
    listen 80;
    server_name localhost;

    # Root access
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API proxy for root access (no trailing slash to preserve /api)
    location /api/ {
        proxy_pass http://smr-core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Subpath access (/smr-platform/)
    location /smr-platform/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # API proxy for subpath access (/smr-platform/api/)
    location /smr-platform/api/ {
        proxy_pass http://smr-core:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
